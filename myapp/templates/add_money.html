<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Money — Darkshadow</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1A3C;--blue:#1E5FFF;--blue-deep:#0F2E82;
    --gold:#FFC107;--gold-deep:#E5A800;
    --white:#fff;--grey:#9FB0D8;--dark:#060f28;
    --green:#22c55e;--line:rgba(255,255,255,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Sora',sans-serif;background:var(--dark);color:var(--white);min-height:100vh;
    background-image:radial-gradient(circle at 80% 10%,rgba(30,95,255,0.2) 0%,transparent 45%),
      radial-gradient(circle at 10% 90%,rgba(255,193,7,0.1) 0%,transparent 40%);
  }
  a{text-decoration:none;color:inherit;}
  header{border-bottom:1px solid var(--line);padding:20px 0;}
  .wrap{max-width:1200px;margin:0 auto;padding:0 24px;}
  .nav-inner{display:flex;align-items:center;justify-content:space-between;}
  .logo{display:flex;align-items:center;gap:10px;font-family:'Orbitron',sans-serif;font-weight:900;font-size:20px;letter-spacing:2px;}
  .logo .icon-box{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--blue-deep),var(--blue));border:2px solid var(--gold-deep);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--gold);font-family:'Orbitron',sans-serif;font-weight:900;}
  .logo .brand-name{font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;letter-spacing:3px;background:linear-gradient(135deg,#fff 0%,var(--gold) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .nav-links{display:flex;align-items:center;gap:20px;}
  .nav-links a{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--grey);transition:color .2s;}
  .nav-links a:hover{color:var(--gold);}
  .page-body{display:flex;justify-content:center;padding:48px 24px 80px;}
  .card{
    background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(12px);border-radius:20px;padding:44px 48px;
    width:100%;max-width:520px;box-shadow:0 30px 80px rgba(0,0,0,0.5);
  }
  .eyebrow{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;display:block;}
  .card h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:24px;letter-spacing:1px;margin-bottom:6px;}
  .card .sub{font-size:13px;color:var(--grey);margin-bottom:28px;}
  /* Balance pill */
  .balance-pill{
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.25);
    border-radius:12px;padding:16px 20px;margin-bottom:28px;
  }
  .balance-pill .bp-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--grey);}
  .balance-pill .bp-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;color:var(--green);}
  /* Messages */
  .messages{margin-bottom:20px;}
  .msg{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:8px;font-family:'Rajdhani',sans-serif;font-weight:600;}
  .msg.error{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.4);color:#fca5a5;}
  .msg.success{background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.4);color:#86efac;}
  /* Fields */
  .field{margin-bottom:20px;}
  .field label{display:block;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--grey);margin-bottom:7px;}
  .field input,.field select{
    width:100%;padding:13px 16px;
    background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
    border-radius:10px;color:var(--white);font-family:'Sora',sans-serif;font-size:14px;
    outline:none;transition:border-color .2s,box-shadow .2s;
  }
  .field select option{background:#0d1e45;color:var(--white);}
  .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(30,95,255,0.2);}
  .field input::placeholder{color:#4a5774;}
  /* Quick amounts */
  .quick-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .quick-btn{
    flex:1;min-width:70px;padding:10px 6px;
    background:rgba(255,193,7,0.08);border:1px solid rgba(255,193,7,0.2);
    border-radius:8px;color:var(--gold);font-family:'Rajdhani',sans-serif;
    font-weight:700;font-size:13px;cursor:pointer;transition:background .2s;
    text-align:center;
  }
  .quick-btn:hover{background:rgba(255,193,7,0.2);}
  .btn-submit{
    width:100%;padding:15px;
    background:linear-gradient(180deg,var(--gold) 0%,var(--gold-deep) 100%);
    color:var(--navy);border:none;border-radius:10px;
    font-family:'Orbitron',sans-serif;font-weight:700;font-size:14px;
    letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;transition:transform .15s,box-shadow .15s;
    box-shadow:0 8px 24px rgba(255,193,7,0.35);margin-top:8px;
  }
  .btn-submit:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,193,7,0.5);}
  .secure-note{text-align:center;font-size:11.5px;color:#3a4a6a;font-family:'Rajdhani',sans-serif;letter-spacing:0.5px;margin-top:18px;}
  .glow-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:-1;}
  .glow-orb.blue{width:400px;height:400px;background:rgba(30,95,255,0.12);top:-120px;right:-100px;}
  .glow-orb.gold{width:300px;height:300px;background:rgba(255,193,7,0.07);bottom:-80px;left:-60px;}
  @media(max-width:560px){.card{padding:32px 20px;}.quick-btn{font-size:12px;}}
</style>
</head>
<body>
<div class="glow-orb blue"></div>
<div class="glow-orb gold"></div>
<header>
  <div class="wrap nav-inner">
    <a href="/" class="logo">
      <span class="icon-box">D</span>
      <span class="brand-name">DARKSHADOW</span>
    </a>
    <div class="nav-links">
      <a href="/my-wallet/">&#128179; My Wallet</a>
      <a href="/">Home</a>
      <a href="/logout/">Logout</a>
    </div>
  </div>
</header>
<div class="page-body">
  <div class="card">
    <span class="eyebrow">&#128179; Wallet</span>
    <h1>Add Money</h1>
    <p class="sub">Top up your Darkshadow wallet instantly.</p>
    <div class="balance-pill">
      <div>
        <div class="bp-label">Current Balance</div>
      </div>
      <div class="bp-val">&#8377;{{ wallet.balance }}</div>
    </div>
    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    <form method="POST" action="/add-money/">
      {% csrf_token %}
      <div class="field">
        <label>Quick Select Amount</label>
        <div class="quick-row">
          <button type="button" class="quick-btn" onclick="setAmt(100)">&#8377;100</button>
          <button type="button" class="quick-btn" onclick="setAmt(500)">&#8377;500</button>
          <button type="button" class="quick-btn" onclick="setAmt(1000)">&#8377;1K</button>
          <button type="button" class="quick-btn" onclick="setAmt(2000)">&#8377;2K</button>
          <button type="button" class="quick-btn" onclick="setAmt(5000)">&#8377;5K</button>
        </div>
      </div>
      <div class="field">
        <label for="amount">Enter Amount (&#8377;)</label>
        <input type="number" id="amount" name="amount" min="1" max="100000" placeholder="e.g. 500" required>
      </div>
      <div class="field">
        <label for="method">Payment Method</label>
        <select id="method" name="method">
          <option value="upi">&#128241; UPI</option>
          <option value="card">&#128179; Credit / Debit Card</option>
          <option value="netbanking">&#127968; Net Banking</option>
          <option value="wallet">&#128200; Wallet Transfer</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">&#9889; Add Money Now</button>
    </form>
    <p class="secure-note">&#128274; 256-bit SSL Secured &nbsp;|&nbsp; Instant Credit &nbsp;|&nbsp; 18+ Only</p>
  </div>
</div>
<script>
  function setAmt(v){ document.getElementById('amount').value = v; }
</script>
</body>
</html>
